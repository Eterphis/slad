name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries for OpenCV / ONNX Runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0 libgomp1
      - run: python -m pip install -r requirements.txt
      # no UZP data in CI: tests that need it skip themselves; the rest use repo fixtures
      - run: python -m unittest discover -s tests -t .
      - name: Recipes load and validate
        run: python -c "from odw2json.engine import load_recipes; print(len(load_recipes('recipes')), 'recipes valid')"
