  <div class="ct-frame ct-frame--l ct-frame--ice ct-panel"><p class="ct-label">Cut L, ice edge</p><p class="ct-cap">Panels, screens</p></div>
  <div class="ct-frame ct-frame--well ct-panel"><p class="ct-label">Well</p><p class="ct-cap">Frosted, below the surface</p></div>
</div>
</div>
