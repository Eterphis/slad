<style>
/* Eterphis logo 2.0. Load after cold-trace.css.
   The SVG carries its own colours (tokens with night fallbacks); this file sets the mark's colours per
   mode, the Charge and Live motion, and the lockups. The letter is a real cut-out: the page shows through. */

:root, [data-theme="dark"] {
  --eph-paint: #EAF3F7;      /* the square: ice ink */
  --eph-paint-2: #C6D9E3;    /* its second tone */
  --eph-phi: #93AEBE;        /* the Φ, a few shades off the paint */
  --eph-streak-hi: #FFFFFF;
  --eph-streak-lo: #93AEBE;
  --eph-head: #FFFFFF;       /* the bright head of the current */
}
[data-theme="light"] {
  --eph-paint: #0B1B26;
  --eph-paint-2: #172F3D;
  --eph-phi: #33505F;
  --eph-streak-hi: #24404F;
  --eph-streak-lo: #33505F;
  --eph-head: #001B2B;
}

.eph, .eph-wordmark { display: inline-block; flex: none; vertical-align: middle; overflow: visible; }

/* Charge: once, about 2.5s. Current climbs the Φ's stem, then runs the letter in three strokes:
   up the p and over the arch, a spark at the spike, down the ascender into the bowl, out along the
   leg, and the dot sparks. */
.eph--charge .eph-t--phi { animation: eph-rise 460ms cubic-bezier(.65, 0, .35, 1) 0ms both, eph-fade 500ms ease 1650ms both; }
.eph--charge .eph-t--M1 { animation: eph-draw 430ms cubic-bezier(.65, 0, .35, 1) 300ms both, eph-fade 600ms ease 1950ms both; }
.eph--charge .eph-h--M1 { animation: eph-run 430ms cubic-bezier(.65, 0, .35, 1) 300ms both; }
.eph--charge .eph-t--M2 { animation: eph-draw 400ms cubic-bezier(.65, 0, .35, 1) 760ms both, eph-fade 600ms ease 1950ms both; }
.eph--charge .eph-h--M2 { animation: eph-run 400ms cubic-bezier(.65, 0, .35, 1) 760ms both; }
.eph--charge .eph-t--M3 { animation: eph-draw 290ms cubic-bezier(.65, 0, .35, 1) 1180ms both, eph-fade 600ms ease 1950ms both; }
.eph--charge .eph-h--M3 { animation: eph-run 290ms cubic-bezier(.65, 0, .35, 1) 1180ms both; }
.eph--charge .eph-sk--ms { animation: eph-spark 300ms cubic-bezier(.16, 1, .3, 1) 750ms both; }
.eph--charge .eph-sk--md { animation: eph-spark 520ms cubic-bezier(.16, 1, .3, 1) 1490ms both; }
@keyframes eph-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes eph-rise { from { stroke-dashoffset: -100; } to { stroke-dashoffset: 0; } }
@keyframes eph-run { from { stroke-dashoffset: 8; } to { stroke-dashoffset: -101; } }
@keyframes eph-fade { from { opacity: 1; } to { opacity: 0; } }
@keyframes eph-spark { 0% { opacity: 0; transform: scale(.4); } 18% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }

/* Live: the same pulse every 3s, for waits over a second. */
.eph--live .eph-h--M1 { animation: eph-l-M1 3s infinite; }
@keyframes eph-l-M1 { 0%, 0.0% { stroke-dashoffset: 8; animation-timing-function: cubic-bezier(.65, 0, .35, 1); } 11.8%, 100% { stroke-dashoffset: -101; } }
.eph--live .eph-h--M2 { animation: eph-l-M2 3s infinite; }
@keyframes eph-l-M2 { 0%, 12.6% { stroke-dashoffset: 8; animation-timing-function: cubic-bezier(.65, 0, .35, 1); } 23.5%, 100% { stroke-dashoffset: -101; } }
.eph--live .eph-h--M3 { animation: eph-l-M3 3s infinite; }
@keyframes eph-l-M3 { 0%, 24.1% { stroke-dashoffset: 8; animation-timing-function: cubic-bezier(.65, 0, .35, 1); } 32.0%, 100% { stroke-dashoffset: -101; } }
.eph--live .eph-sk--ms { animation: eph-l-sk-ms 3s infinite; }
@keyframes eph-l-sk-ms { 0%, 12.3% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 14.3% { opacity: 1; } 20.3%, 100% { opacity: 0; transform: scale(1.25); } }
.eph--live .eph-sk--md { animation: eph-l-sk-md 3s infinite; }
@keyframes eph-l-sk-md { 0%, 32.5% { opacity: 0; transform: scale(.4); animation-timing-function: cubic-bezier(.16, 1, .3, 1); } 34.5% { opacity: 1; } 46.5%, 100% { opacity: 0; transform: scale(1.25); } }

@media (prefers-reduced-motion: reduce) {
  .eph * { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; }
}

/* Lockups. Set --eph-size to the mark size (default 40px).
   Horizontal: the wordmark is 0.55 of the mark's height, 0.16 of it away.
   Stacked: the mark over the wordmark (0.7 of --eph-size high), centred. */
.eph-lockup { --eph-size: 40px; display: inline-flex; align-items: center; gap: calc(var(--eph-size) * .16); color: var(--ct-ink); text-decoration: none; }
.eph-lockup--h .eph-wordmark { height: calc(var(--eph-size) * .55); width: auto; }
.eph-lockup--v { flex-direction: column; gap: calc(var(--eph-size) * .12); }
.eph-lockup--v .eph-wordmark { height: calc(var(--eph-size) * .7); width: auto; }
.eph-lockup:focus-visible { outline: 2px solid var(--ct-signal); outline-offset: 4px; }

.lg { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; padding: 16px; }
.lg__cell { display: grid; place-items: center; gap: 16px; padding: 20px; background: var(--ct-ground); }
</style>
