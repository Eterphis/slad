<!-- @dsCard group="Structure" height=230 subtitle="Top bar with the Daylight switch, side nav" -->
<div class="ct" style="padding: 24px; min-height: 100%">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-bottom: 12px; border-bottom: 1px solid var(--ct-rule)">
  <a class="ct-mark" href="#">Project name</a>
  <nav class="ct-nav" aria-label="Main"><a href="#" aria-current="page">Docs</a><a href="#">Pricing</a><a href="#">Changelog</a></nav>
  <div class="ct-switch-row">
    <button class="ct-toggle" type="button" role="switch" aria-checked="false" aria-labelledby="mode-l" id="mode"><span class="ct-toggle__body"><span class="ct-toggle__trace"></span><span class="ct-toggle__thumb"></span></span></button>
    <span id="mode-l" class="ct-label">Daylight</span>
  </div>
</div>
<nav class="ct-sidenav" aria-label="Workspace" style="max-width: 240px; margin-top: 16px">
  <a href="#" aria-current="page"><svg class="ct-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M2,12 L12,2 L22,12 M5,9 V21 H16 L19,18 V9"/><circle cx="12" cy="16" r="2" style="fill: var(--ct-via, var(--ct-panel))"/></svg> Overview</a>
  <a href="#"><svg class="ct-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3,6 H13 M17,6 H21 M13,4 H17 V8 H13 Z M3,12 H6 M10,12 H21 M3,18 H15 M19,18 H21 M15,16 H19 V20 H15 Z"/><circle cx="8" cy="12" r="2" style="fill: var(--ct-via, var(--ct-panel))"/></svg> Settings</a>
</nav>
</div>
<script>
var m = document.getElementById('mode');
m.setAttribute('aria-checked', String(document.documentElement.getAttribute('data-theme') === 'light'));
m.addEventListener('click', function () {
  var light = m.getAttribute('aria-checked') !== 'true';
  m.setAttribute('aria-checked', String(light));
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
});
</script>
