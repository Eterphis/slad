    <span class="ct-toggle__body"><span class="ct-toggle__trace"></span><span class="ct-toggle__thumb"></span></span>
  </button>
  <span id="t1">Email me when a build fails</span>
</div>
<div class="ct-switch-row">
  <button class="ct-toggle" type="button" role="switch" aria-checked="false" aria-labelledby="t2" data-ct-switch>
    <span class="ct-toggle__body"><span class="ct-toggle__trace"></span><span class="ct-toggle__thumb"></span></span>
  </button>
  <span id="t2">Weekly summary</span>
</div>
</div>
