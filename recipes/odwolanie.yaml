# Appeal to the National Appeal Chamber (odwołanie do KIO). Output: schemas/odwolanie.json.
# First set of fields; T006 completes the harder layouts (consortia, narrative charges).
class: odwolanie
description: Odwołanie do Prezesa Krajowej Izby Odwoławczej
classify:
  min_score: 4
  margin: 1
  signals:
    - {pattern: "prezes\\w* krajowej izby odwolawczej|krajowa izba odwolawcza", weight: 3, head: 2500}
    - {pattern: "odwo\\w{0,3}ujac\\w*\\s*:", weight: 2}
    - {pattern: "odwolanie", weight: 1, squash: true}
    - {pattern: "zarzut|zarzucam", weight: 1}
    - {pattern: "zamawiajac\\w*\\s*:", weight: 1}
  forbidden:
    - {pattern: "see the notice on ted website|ogloszenie o zamowieniu lub ogloszenie o koncesji", head: 600}
    # an e-mail printout that forwards the appeal ("Od: ... Do: ... Temat: Kopia odwołania")
    - {pattern: '^od:[^\n]*\n(?:[^\n]*\n){0,3}?do:[^\n]*\n(?:[^\n]*\n){0,4}?(?:temat|subject):', head: 400}
    # a KIO ruling (wyrok / postanowienie) quotes the appeal but is not one
    - {pattern: 'sygn\.? ?akt:? ?kio.{0,200}?(?:postanowienie|wyrok)|(?:postanowienie|wyrok)\b.{0,200}?sygn\.? ?akt|krajowa izba odwolawcza\s*-?\s*w skladzie|przewodniczac\w*\s*:', head: 1200}

sections:
  # ends at the next party's heading too (selected contractor / participant / intervener): its KRS is not the appellant's
  - {name: odwolujacy, start: "^odwo\\w{0,3}ujac\\w*\\s*:", end: "^(zamawiajac\\w*\\s*:|wykonawca\\s+wybran|uczestnik\\w*\\s*(?:\\(|postepowania|po stronie)|przystepujac|odwolanie\\s*$|o d w o l a n i e|dotyczy|prezes)"}
  - {name: zamawiajacy, start: "^zamawiajac\\w*\\s*:", end: "^(odwo\\w{0,3}ujac\\w*\\s*:|odwolanie\\s*$|o d w o l a n i e|dotyczy|prezes)"}
  - {name: zamawiajacy_wspolnie, start: 'wspolnie\s+(?:udzielajac|przeprowadzajac|prowadzac)', end: '^(odwo\w{0,3}ujac\w*\s*:|odwolanie\s*$|o d w o l a n i e|dotyczy|prezes)'}
  - {name: czynnosc, start: '(?:\bwnos\w*\s+odwolanie\s+wobec\s*:|\bpolegajac\w*\s+na\s*:|zamawiajac\w* w dniu|\bodwolani\w*\s+(?:bwnosz\w*\s+|wnosi\s+)?(?:od|wobec|na)\s+czynnosc|\bzaskarz\w*\s+czynnosc|\bwobec\s+(?:tresci|postanowien|zapisow)\s+(?:dokumentow zamowienia|specyfikacji|swz))', end: "zarzu[tc]"}

fields:
  - path: OdwolanieKIO.miejscowosc
    strategies:
      - {use: regex, pattern: "^(?P<v>[a-z][a-z.-]+(?: [a-z.-]+){0,3}),\\s*(?:dnia\\s+)?\\d{1,2}(?:\\.\\d{1,2}\\.\\d{4}| [a-z]+ \\d{4})"}
      - {use: regex, pattern: "^(?P<v>[a-z][a-z-]+)\\s+(?:dnia\\s+)?\\d{1,2}\\.\\d{1,2}\\.\\d{4}"}
    normalize: [strip, restore_diacritics]
  - path: OdwolanieKIO.data
    strategies:
      - {use: regex, pattern: "^[a-z][a-z.-]+(?: [a-z.-]+){0,3},\\s*(?:dnia\\s+)?(?P<v>\\d{1,2}(?:\\.\\d{1,2}\\.\\d{4}| [a-z]+ \\d{4}))"}
      - {use: regex, pattern: "^[a-z][a-z-]+\\s+(?:dnia\\s+)?(?P<v>\\d{1,2}\\.\\d{1,2}\\.\\d{4})"}
    normalize: date_pl
  - path: OdwolanieKIO.czynnosc_dzien
    strategies:
      # the filing's own timeliness paragraph: "Informacja o zaskarżonej czynności została przekazana ... w dniu 01.04.2026"
      - {use: regex, pattern: 'informacj\w*\s+o\s+zaskarzon\w*\s+czynnosc\w*[^.]{0,80}?\s(?:w dniu|dnia)\s+(?P<v>[o\d]{1,2}\s?[./]\s?\d{2}\s?[./]\s?\d{4}|\d{1,2} [a-z]+ \d{4})'}
      - {use: regex, section: czynnosc, pattern: '(?<!ustawy )(?<!ustawa )(?<!ustawy z )(?<!ustawa z )(?<!odwolawczej z )(?<!wyroku z )(?<!wyrok z )(?:w dniu|z dnia|\bdnia) (?P<v>\d{1,2} [a-z]+ \d{4}|\d{1,2}\.\d{2}\.\d{4})'}
    normalize: date_pl
  - path: OdwolanieKIO.czynnosc_powod_id
    section: czynnosc
    strategies:
      - {use: lookup, dictionary: czynnosc_powod, return: id}
  - path: OdwolanieKIO.czynnosc_opis
    section: czynnosc
    strategies:
      - {use: lookup, dictionary: czynnosc_powod, return: label}

  # Prose party intro of real appeals: "X sp. z o.o. z siedzibą w Y, KRS ..., NIP ... (dalej: „Odwołujący”)".
  # These run first; the labelled "Odwołujący:" header block below overwrites them when the document has one.
  - path: Odwolujacy.nazwa
    strategies:
      - {use: regex, pattern: '\bw imieniu\s+(?P<v>[^,(\n]{3,}?)\s*(?:,|\(|\bz siedzib)[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac'}
      - {use: regex, pattern: '(?P<v>\b[^\n„"(;:,.]{2,}?\s(?:sp\. z o\.\s?o\.|s\.\s?a\.|sp\.\s?[jkp]\.|spolka [^\n,(]{3,40}?))\s*(?:,|\bz siedzib)[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac'}
      - {use: regex, pattern: '^(?:\d{1,2}[.)]\s*)?(?P<v>[^\n„"(;:,]{3,}?)\s*(?:,|\bz siedzib)[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac'}
    normalize: strip
  - path: Odwolujacy.krs
    strategies:
      - {use: regex, pattern: 'krs\D{0,15}?(?P<v>\d{10})(?!\d)(?=[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac)'}
  - path: Odwolujacy.nip
    strategies:
      - {use: regex, pattern: 'nip\W{0,3}(?:nr\W{0,3})?(?P<v>\d{10}|\d{3}[ -]\d{3}[ -]\d{2}[ -]\d{2}|\d{3}[ -]\d{2}[ -]\d{2}[ -]\d{3})(?![\d-])(?=[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac)'}
    normalize: digits
    validate: nip

  - path: Odwolujacy.regon
    strategies:
      - {use: regex, pattern: 'regon\W{0,3}(?P<v>\d{9}(?:\d{5})?)(?!\d)(?=[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac)'}
    validate: regon
  # "... (dalej: „Odwołujący”), reprezentowany przez adw. Jan Nowak, ... e-mail: ..."
  - path: Odwolujacy.pelnomocnik.imie_nazwisko
    strategies:
      - {use: regex, pattern: '\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac[^)]*\)[^()]{0,80}?reprezentowan\w* przez:?\s*(?:pelnomocnika:?\s*)?(?:r\.\s?pr\.|adw\.|radc\w* prawn\w*|adwokat\w*|mec\.)\s*(?P<v>[a-z]+\s+[a-z-]+)'}
    normalize: person_nom
  - path: Odwolujacy.pelnomocnik.mail
    strategies:
      - {use: regex, pattern: '\(\s*(?:dalej|zwan\w*)[^)]{0,40}?odwo\w{0,3}ujac[^)]*\)[^()]{0,80}?reprezentowan\w* przez[^@]{0,300}?(?P<v>[\w.+-]+@[\w-]+(?:\.[\w-]+)+)'}

  - path: Odwolujacy.nazwa
    section: odwolujacy
    strategies:
      # a sole trader: "Odwołujący: Jan Kowalski prowadzący działalność gospodarczą pod firmą" / "<trade name>"
      - {use: regex, pattern: '^odwo\w{0,3}ujac\w*\s*:[^\n]*?\bpod\s+firma\s+(?P<v>[\s\S]+?)(?=\s*,?\s*(?:ul\.|al\.|pl\.|os\.|aleje\b|\d{2}-\d{3}\b|nip\b|krs\b|regon\b|tel\b|e-?mail\b))'}
      # a consortium listing its members: "1) Lider Konsorcjum:" / "<name>" (the first member, on the next line)
      - {use: regex, pattern: '^odwo\w{0,3}ujac\w*\s*:\s*konsorcjum[\s\S]{0,300}?(?:lider\w*|partner\w*)\s+konsorcjum\w*\s*:[ \t]*\n\s*(?P<v>[^\n]+)'}
      # a consortium: "Odwołujący: Konsorcjum wykonawców:" / "1) Lider sp. k. (Lider Konsorcjum)": the first member
      - {use: regex, pattern: '^odwo\w{0,3}ujac\w*\s*:\s*konsorcjum[^\n]*\n\s*(?:1[.)]\s*)?(?P<v>[^\n(]+?)\s*(?:\(|,\s|\n)'}
      # "Odwołujący: Wykonawcy wspólnie ubiegający się o udzielenie zamówienia:" / "1) <leader> (Lider konsorcjum)"
      - {use: regex, pattern: '^odwo\w{0,3}ujac\w*\s*:?\s*(?:\n\s*)?wykonawc\w*\s+wspolnie\s+ubiegajac\w*[^\n]*\n\s*(?:1[.)]\s*)?(?P<v>[^\n(]+?)\s*(?:\(|,\s|\n)'}
      # not a contact label: with a two-column header the name can sit above the label (then it is not read here)
      - {use: regex, pattern: "^odwo\\w{0,3}ujac\\w*\\s*:(?!\\s*(?:krs|nip|regon|tel|fax|e-?mail)\\b)[ \\t]*\\n*\\s*(?P<v>[^\\n]+)"}
    normalize: company
  - path: Odwolujacy.krs
    section: odwolujacy
    strategies:
      - {use: regex, pattern: 'krs\D{0,15}?(?P<v>\d{10})(?!\d)'}
  - path: Odwolujacy.nip
    section: odwolujacy
    strategies:
      - {use: regex, pattern: 'nip\W{0,3}(?:nr\W{0,3})?(?P<v>\d{10}|\d{3}[ -]\d{3}[ -]\d{2}[ -]\d{2}|\d{3}[ -]\d{2}[ -]\d{2}[ -]\d{3})(?![\d-])'}
    normalize: digits
    validate: nip
  - path: Odwolujacy.regon
    section: odwolujacy
    strategies:
      - {use: regex, pattern: "regon:?\\s*(?P<v>\\d{9}(\\d{5})?)"}
    validate: regon
  - path: Odwolujacy.pelnomocnik.imie_nazwisko
    section: odwolujacy
    strategies:
      - {use: regex, pattern: 'reprezentowan\w*\s+przez[.:]?\s*(?:p\w{2,3}nomocnik\w*[.:]?\s*)?(?:(?:r\.\s?pr\.|adw\.|radc\w*\s+prawn\w*|adwokat\w*|mec\.)\s*)?(?<![a-z])(?!(?:kancelari|biur|firm|spolk|radc|adwokat|prawn)\w*\s)(?P<v>[a-z]+\s+[a-z-]+)'}
    normalize: person_nom
  - path: Odwolujacy.pelnomocnik.nazwa
    section: odwolujacy
    strategies:
      # the firm's name runs up to the address ("ul. ...", a postcode) or the phone/e-mail line; it may wrap or hold commas
      - {use: regex, pattern: 'adres\s+do\s+korespondenc\w*:?\s*(?P<v>[\s\S]+?)(?=\s*,?\s*(?:ul\.|al\.|pl\.|os\.|aleje\b|\d{2}-\d{3}\b|nip\b|krs\b|regon\b|tel\b|e-?mail\b))'}
    normalize: strip
  - path: Odwolujacy.pelnomocnik.mail
    section: odwolujacy
    strategies:
      # the attorney's address, not the appellant's own: an e-mail after the attorney/law-firm mention first
      - {use: regex, pattern: '(?:pelnomocni\w*|reprezentowan\w*|adw\.|r\.\s?pr\.|radc\w*|adwokat\w*|kancelari\w*)[^@]{0,300}?(?P<v>[\w.+-]+@[\w-]+(?:\.[\w-]+)+)'}
  - path: Odwolujacy.przez-pelnomocnika
    strategies:
      # represented as soon as ANY attorney field was found (the name itself may be unreadable in a scan)
      - {use: regex, section: odwolujacy, pattern: '(?P<v>reprezentowan\w*\s+przez\s+(?:p\w{2,3}nomocnik\w*\s+)?(?:r\.\s?pr|adw\.|radc|adwokat|mec\.|kancelari))'}
      - {use: derived, if_set: Odwolujacy.pelnomocnik.imie_nazwisko, value: 1}
      - {use: derived, if_set: Odwolujacy.pelnomocnik.nazwa, value: 1, else: 0}
    normalize: flag

  # prose intro "... (dalej: „Zamawiający”)"; a labelled "Zamawiający:" block below overwrites it
  - path: Zamawiajacy.nazwa
    strategies:
      - {use: regex, pattern: '^(?:\d{1,2}[.)]\s*)?(?P<v>[^\n„"(;:,]{3,}?)\s*(?:,|\bz siedzib)[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?zamawiajac'}
    normalize: strip
  - path: Zamawiajacy.krs
    strategies:
      - {use: regex, pattern: 'krs\D{0,15}?(?P<v>\d{10})(?!\d)(?=[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?zamawiajac)'}
  - path: Zamawiajacy.nip
    strategies:
      - {use: regex, pattern: 'nip\W{0,3}(?:nr\W{0,3})?(?P<v>\d{10}|\d{3}[ -]\d{3}[ -]\d{2}[ -]\d{2}|\d{3}[ -]\d{2}[ -]\d{2}[ -]\d{3})(?![\d-])(?=[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?zamawiajac)'}
    normalize: digits
    validate: nip
  - path: Zamawiajacy.regon
    strategies:
      - {use: regex, pattern: 'regon\W{0,3}(?P<v>\d{9}(?:\d{5})?)(?!\d)(?=[^()]{0,300}?\(\s*(?:dalej|zwan\w*)[^)]{0,40}?zamawiajac)'}
    validate: regon
  - path: Zamawiajacy.nazwa
    section: zamawiajacy
    strategies:
      # the name may wrap onto a second line that does not look like an address / contact line
      - {use: regex, pattern: '^zamawiajac\w*\s*:[ \t]*\n*\s*(?P<v>[^\n]+(?:\n(?!\s*(?:ul\.|al\.|pl\.|os\.|\d{2}-\d{3}|nip\b|krs\b|regon\b|tel\b|e-?mail\b|dotyczy))[^\n]+)?)'}
    normalize: company
  - path: Zamawiajacy.krs
    section: zamawiajacy
    strategies:
      - {use: regex, pattern: 'krs\D{0,15}?(?P<v>\d{10})(?!\d)'}
  - path: Zamawiajacy.nip
    section: zamawiajacy
    strategies:
      - {use: regex, pattern: 'nip\W{0,3}(?:nr\W{0,3})?(?P<v>\d{10}|\d{3}[ -]\d{3}[ -]\d{2}[ -]\d{2}|\d{3}[ -]\d{2}[ -]\d{2}[ -]\d{3})(?![\d-])'}
    normalize: digits
    validate: nip
  - path: Zamawiajacy.regon
    section: zamawiajacy
    strategies:
      - {use: regex, pattern: "regon:?\\s*(?P<v>\\d{9}(\\d{5})?)"}
    validate: regon

  # Several contracting authorities ("Zamawiający wspólnie udzielający zamówienia: 1) X ... 2) Y ..."): one item
  # each; the one marked "prowadzący postępowanie" gets 1, the others 0. Only evaluated when that wording exists.
  - path: Zamawiajacy
    section: zamawiajacy_wspolnie
    list_of_blocks:
      start: '^[ \t]*\d{1,2}[.)][ \t]*\S'
      min_blocks: 2
    fields:
      - path: nazwa
        strategies:
          # "1) Zamawiający – Lider, prowadzący postępowanie:" / "<name>" (the name on the next line)
          - {use: regex, pattern: '^[ \t]*\d{1,2}[.)][ \t]*zamawiajac\w*\s*[-–][^\n]*:[ \t]*\n\s*(?P<v>[^\n]+)'}
          - {use: regex, pattern: '^[ \t]*\d{1,2}[.)][ \t]*(?P<v>[^\n]+)'}
        normalize: company
      - path: krs
        strategies:
          - {use: regex, pattern: 'krs\D{0,15}?(?P<v>\d{10})(?!\d)'}
      - path: nip
        strategies:
          - {use: regex, pattern: 'nip\W{0,3}(?:nr\W{0,3})?(?P<v>\d{10}|\d{3}[ -]\d{3}[ -]\d{2}[ -]\d{2}|\d{3}[ -]\d{2}[ -]\d{2}[ -]\d{3})(?![\d-])'}
        normalize: digits
        validate: nip
      - path: regon
        strategies:
          - {use: regex, pattern: 'regon:?\s*(?P<v>\d{9}(\d{5})?)'}
        validate: regon
      - path: prowadzacy_postepowanie
        strategies:
          - {use: regex, pattern: 'prowadzac\w*\s+postepowanie'}
          - {use: const, value: 0}
        normalize: flag

  # The notice numbers of THIS procedure stand in the header ("dotyczy: ..."); later text may cite other tenders,
  # so only the first 3500 characters are searched.
  - path: ZamowieniePubliczne.numer_bzp
    strategies:
      - {use: regex, pattern: '\A[\s\S]{0,3500}?(?P<v>\d{4}\s*/\s*bzp\s*\d{8}(?:/\d{2})?)'}
    normalize: bzp
  - path: ZamowieniePubliczne.numer_ted
    strategies:
      - {use: regex, pattern: '\A[\s\S]{0,3500}?(?P<v>\d{4}\s*/\s*s\s*\d{1,3}\s*-\s*\d{6})'}
      - {use: regex, pattern: '\A[\s\S]{0,3500}?(?:ted|dzienniku\s+urzedowym\s+(?:ue|unii\s+europejskiej)|dz\.\s*urz\.\s*ue)\w*:?\s*(?:nr\s*)?(?P<v>\d{6}-\d{4})'}
    normalize: ted
  - path: ZamowieniePubliczne.numer_postepowania
    strategies:
      - {use: regex, pattern: "(?:nr\\s+postepowania\\s+u\\s+zamawiajacego|znak\\s+postepowania|numer\\s+sprawy|nr\\s+sprawy|oznaczenie\\s+sprawy|nr\\s*referencyjn\\w*(?:\\s+sprawy)?|numer\\s+postepowania|nr\\s+postepowania|postepowanie\\s+nr|znak\\s+sprawy)\\s*:?\\s*(?P<v>[a-z0-9][\\w./-]*[a-z0-9])"}
  - path: ZamowieniePubliczne.tytul
    strategies:
      - {use: regex, pattern: "pn\\.?:?\\s*[\"„”](?P<v>[^\"”]+)[\"”]"}
      # scans: the opening quote is often lost and the title wraps over lines: pn. Title", nr referencyjny
      - {use: regex, pattern: 'pn\.?:?\s*[„”",\s]*(?P<v>[^"„”\n][^"„”]{8,}?)["”„]?\s*,\s*(?:nr|numer)\s*(?:referencyjn|postepowania|sprawy)'}
      # "pn.: <title>" (postepowanie nr ...)": the title ends at the closing quote and the bracket with the number
      - {use: regex, pattern: 'pn\.?:?\s*[„”",\s]*(?P<v>[^"„”\n][^"„”]{8,}?)["”„]?\s*\(\s*(?:postepowanie\s+)?(?:nr|numer)\b'}
    normalize: [strip, ocr_text, restore_diacritics]

# Optional local-LLM reader (profile `llm`, docs/LLM.md): asked only for fields the rules above left empty. The model
# transcribes, the normalisers below turn it into the output value, a quote not found in the page text drops the value.
llm:
  context: {pages: 2, max_chars: 4500}
  fields:
    - path: OdwolanieKIO.czynnosc_powod_id
      type: integer
      question: "Which act of the contracting authority does the appeal challenge first (the first charge: the act or omission the appeal is lodged against)?"
      choices: {dictionary: czynnosc_powod}
      also: {path: OdwolanieKIO.czynnosc_opis, key: label}
    - path: ZamowieniePubliczne.numer_bzp
      question: "Number of the notice in the Biuletyn Zamowien Publicznych (BZP), such as 2026/BZP00123456/01."
      normalize: bzp
      when: "bzp"   # the notice number is only worth a question when the text mentions BZP
    - path: ZamowieniePubliczne.numer_postepowania
      question: "The contracting authority's own reference number of the procedure (numer postepowania / znak sprawy / nr referencyjny)."
      normalize: strip
    - path: Odwolujacy[0].nazwa
      question: "Full name of the appellant (Odwolujacy), the contractor that files the appeal, with its legal form."
      hint: "Not the contracting authority (Zamawiajacy) and not the attorney."
      normalize: strip
    - path: Zamawiajacy[0].nazwa
      question: "Full name of the contracting authority (Zamawiajacy), the buyer whose act is challenged."
      hint: "Not the appellant and not the attorney."
      normalize: strip
